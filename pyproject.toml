[project]
name = "blpapi-relay"
version = "0.1.0"
description = "A relay layer for localhosted browser process to communicate with Bloomberg blpapi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blpapi",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "python-socketio>=5.0.0",
    "python-engineio>=4.0.0",
    "xlwings>=0.35.3",
    "requests>=2.34.2",
    "beautifulsoup4>=4.14.3",
    "pandas>=3.0.3",
]

[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = true

[tool.uv.sources]
blpapi = { index = "bloomberg" }
